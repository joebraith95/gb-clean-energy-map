name: Refresh data

# Reruns the pipeline against the latest REPD release and NESO Interconnector Register and
# commits any changes to data/. Cloudflare Pages deploys the new commit automatically.
# If a source contains a value the spec does not cover, the pipeline stops and this job fails,
# so GitHub emails the repository owner instead of publishing a guess.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline

      - name: Run the pipeline
        run: |
          python -m pipeline.run --report | tee report.txt
          {
            echo '## Pipeline report'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changed data
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh data from REPD and the NESO Interconnector Register"
          git push
